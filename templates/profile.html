{% extends 'base.html' %}
{% block title %}Профиль{% endblock %}
{% block content %}
<div class="user-info">
    <h1>Профиль пользователя</h1>
    <p>Имя пользователя: <strong>{{ user.username }}</strong></p>
    <p>Статус:
        {% if user.is_superuser %}
            <span class="badge text-bg-danger">Администратор</span>
        {% elif is_methodist %}
            <span class="badge text-bg-success">Методист</span>
        {% else %}
            <span class="badge text-bg-secondary">Пользователь</span>
        {% endif %}
    </p>
</div>
{% endblock %}
